plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prosprite.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.prosprite.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '4.0'
    }

    // Keystore tetap supaya APK hasil build berikutnya bisa meng-update yang sudah terpasang
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    androidResources {
        noCompress 'wav', 'jpg', 'png'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
